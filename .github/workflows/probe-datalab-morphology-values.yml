name: Probe DR11 Data Lab morphology values

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/dr11-point-random-selection-residual]
    paths:
      - 'src/probe_datalab_morphology_values.py'
      - '.github/workflows/probe-datalab-morphology-values.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python src/probe_datalab_morphology_values.py
