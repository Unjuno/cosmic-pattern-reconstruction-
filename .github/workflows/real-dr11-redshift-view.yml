name: REAL DR11 x DESI DR1 redshift view

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/redshift_view_validate.py'
      - 'src/redshift_view_replication.py'
      - '.github/workflows/real-dr11-redshift-view.yml'
      - 'run-trigger/redshift-view/**'

permissions:
  contents: read
  actions: read

jobs:
  redshift-view:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Materialize immutable REAL_DR11 expanded48 source artifact
        uses: actions/download-artifact@v4
        with:
          name: real-dr11-expanded48-32848895159
          path: .expanded48_artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32848895159
      - name: Install and verify observed DR11 source files
        run: |
          mkdir -p data/real/dr11/expanded48
          cp .expanded48_artifact/data/real/dr11/expanded48/*.csv.gz data/real/dr11/expanded48/
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'src')
          from analyze_dr11 import verify_and_load
          p=json.loads(Path('data/real/dr11/expanded48/provenance.json').read_text())
          for r in p['regions']:
              verify_and_load(r)
          print('verified REAL_DR11 expanded48 files:', len(p['regions']))
          PY
      - name: Normalize DESI boolean predicate for current Data Lab schema
        run: sed -i 's/zcat_primary=1/zcat_primary=TRUE/' src/redshift_view_validate.py
      - name: Run fixed expanded48 DESI DR1 redshift-shuffle gate
        run: |
          rm -rf results/real_dr11/redshift_view48
          python src/redshift_view_validate.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/redshift_view48
      - name: Run independent-sky coverage-selected replication
        run: |
          rm -rf results/real_dr11/redshift_view_replication24
          python src/redshift_view_replication.py \
            --original data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/redshift_view_replication24
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-desi-dr1-redshift-view-${{ github.run_id }}
          path: |
            results/real_dr11/redshift_view48
            results/real_dr11/redshift_view_replication24
          if-no-files-found: error
          retention-days: 90
