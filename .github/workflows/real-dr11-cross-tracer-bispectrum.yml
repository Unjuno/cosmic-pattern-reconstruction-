name: REAL DR11 cross-tracer bispectrum

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/cross_tracer_bispectrum_validate.py'
      - 'src/debug_cross_tracer_bispectrum.py'
      - 'src/run_cross_tracer_bispectrum_native.py'
      - '.github/workflows/real-dr11-cross-tracer-bispectrum.yml'
      - 'run-trigger/cross-tracer-bispectrum/**'

permissions:
  contents: read

jobs:
  cross-tracer-bispectrum:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Diagnose first-field tracer acquisition
        run: python src/debug_cross_tracer_bispectrum.py
      - name: Run cross-tracer phase-coupling test
        run: |
          rm -rf results/real_dr11/cross_tracer_bispectrum36
          python src/run_cross_tracer_bispectrum_native.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/cross_tracer_bispectrum36
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dr11-cross-tracer-bispectrum-${{ github.run_id }}
          path: results/real_dr11/cross_tracer_bispectrum36
          if-no-files-found: ignore
          retention-days: 90
