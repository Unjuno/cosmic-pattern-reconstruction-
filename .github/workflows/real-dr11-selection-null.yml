name: REAL DR11 selection null

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/probe_selection_cutout.py'
      - 'src/probe_brick_selection.py'
      - 'src/selection_null_validate.py'
      - '.github/workflows/real-dr11-selection-null.yml'
      - 'run-trigger/selection-null/**'

permissions:
  contents: write

jobs:
  selection-null:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 48-brick pixel-level selection null
        run: |
          rm -rf results/real_dr11/selection_null48
          python src/selection_null_validate.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/selection_null48
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-selection-null-${{ github.run_id }}
          path: results/real_dr11/selection_null48
          if-no-files-found: error
          retention-days: 90
      - name: Commit derived selection-null results
        if: github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add results/real_dr11/selection_null48
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Add REAL_DR11 pixel selection-null results'; git push; fi
