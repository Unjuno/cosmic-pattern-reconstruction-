name: REAL DR11 selection null

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/selection_null_validate_fast.py'
      - 'src/selection_null_validate_coverage.py'
      - 'src/run_selection_null_direct_coverage.py'
      - '.github/workflows/real-dr11-selection-null.yml'
      - 'run-trigger/selection-null/**'

permissions:
  contents: read

jobs:
  selection-null:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 12-field coverage-qualified pixel selection null from official Tractor FITS
        run: |
          rm -rf results/real_dr11/selection_null12
          python src/run_selection_null_direct_coverage.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/selection_null12
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-selection-null12-${{ github.run_id }}
          path: results/real_dr11/selection_null12
          if-no-files-found: error
          retention-days: 90
