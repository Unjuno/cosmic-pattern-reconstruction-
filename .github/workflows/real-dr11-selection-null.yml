name: REAL DR11 selection null

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/probe_selection_cutout.py'
      - 'src/probe_brick_selection.py'
      - 'src/selection_null_validate.py'
      - '.github/workflows/real-dr11-selection-null.yml'
      - 'run-trigger/selection-null/**'

permissions:
  contents: write

jobs:
  selection-null:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Probe official brick selection products
        run: python src/probe_brick_selection.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-selection-probe-${{ github.run_id }}
          path: results/real_dr11/selection_probe
          if-no-files-found: error
          retention-days: 30
