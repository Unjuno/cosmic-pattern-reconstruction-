name: REAL DR11 expanded 48-field replication

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/fetch_dr11_expanded.py'
      - 'src/expanded48_validate.py'
      - 'src/locality_validate.py'
      - '.github/workflows/real-dr11-expanded48.yml'
      - 'run-trigger/expanded48/**'
  push:
    branches: [main]
    paths:
      - 'src/fetch_dr11_expanded.py'
      - 'src/expanded48_validate.py'
      - 'src/locality_validate.py'
      - '.github/workflows/real-dr11-expanded48.yml'

permissions:
  contents: write

jobs:
  expanded48:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch deterministic 48-field REAL DR11 sample
        run: |
          rm -rf data/real/dr11/expanded48
          python src/fetch_dr11_expanded.py --out data/real/dr11/expanded48
      - name: Run 48-field LOFO replication
        run: |
          rm -rf results/real_dr11/expanded48
          python src/expanded48_validate.py --data data/real/dr11/expanded48 --out results/real_dr11/expanded48
      - name: Run 48-field locality-decay validation
        run: |
          python src/locality_validate.py --data data/real/dr11/expanded48 --out results/real_dr11/expanded48
      - name: Record workflow provenance
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path('results/real_dr11/expanded48/workflow.json')
          p.write_text(json.dumps({
              'status':'REAL_DR11',
              'github_repository':os.environ.get('GITHUB_REPOSITORY'),
              'github_sha':os.environ.get('GITHUB_SHA'),
              'github_run_id':os.environ.get('GITHUB_RUN_ID'),
              'experiments':['48-field deterministic-grid replication','48-field locality decay','conditional quintile calibration'],
          },indent=2,sort_keys=True)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-expanded48-${{ github.run_id }}
          path: |
            data/real/dr11/expanded48
            results/real_dr11/expanded48
          if-no-files-found: error
          retention-days: 90
      - name: Commit reproducibility manifest and derived results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/real/dr11/expanded48/provenance.json results/real_dr11/expanded48
          if git diff --cached --quiet; then echo 'No changes.'; else git commit -m 'Add REAL_DR11 48-field locality results'; git push; fi
