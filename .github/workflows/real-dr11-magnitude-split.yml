name: REAL DR11 magnitude split

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/magnitude_split_validate.py'
      - '.github/workflows/real-dr11-magnitude-split.yml'

jobs:
  magnitude-split:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fixed 12-field bright/faint extended-source cross-locality test
        run: |
          rm -rf results/real_dr11/magnitude_split12
          python src/magnitude_split_validate.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/magnitude_split12
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dr11-magnitude-split12-${{ github.run_id }}
          path: results/real_dr11/magnitude_split12
          if-no-files-found: warn
          retention-days: 90
