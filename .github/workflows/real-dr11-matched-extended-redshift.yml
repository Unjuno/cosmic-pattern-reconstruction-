name: REAL DR11 x DESI DR1 matched extended redshift

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/matched_extended_redshift_validate.py'
      - '.github/workflows/real-dr11-matched-extended-redshift.yml'
      - 'docs/MATCHED_EXTENDED_REDSHIFT.md'
      - 'run-trigger/matched-extended-redshift/**'

permissions:
  contents: read

jobs:
  matched-extended-redshift:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/matched_extended_redshift_validate.py
      - name: Run matched extended redshift localization test
        run: |
          python src/matched_extended_redshift_validate.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/matched_extended_redshift
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dr11-desi-matched-extended-redshift-${{ github.run_id }}
          path: results/real_dr11/matched_extended_redshift
          if-no-files-found: warn
          retention-days: 90
