name: REAL DR11 metric isotropy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/materialize_metric48.py'
      - 'src/metric_isotropy_validate.py'
      - '.github/workflows/real-dr11-metric-isotropy.yml'

permissions:
  contents: read

jobs:
  metric-isotropy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Re-materialize 48 provenance-fixed REAL_DR11 fields
        run: python src/materialize_metric48.py
      - name: Run metric-corrected 48-field isotropy test
        run: python src/metric_isotropy_validate.py
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-metric-isotropy-${{ github.run_id }}
          path: results/real_dr11/metric_isotropy48
          if-no-files-found: error
          retention-days: 90
