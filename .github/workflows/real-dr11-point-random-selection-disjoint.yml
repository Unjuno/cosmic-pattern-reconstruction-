name: REAL DR11 point-random disjoint replication

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/point_random_selection_residual_validate.py'
      - 'src/point_random_selection_residual_disjoint.py'
      - '.github/workflows/real-dr11-point-random-selection-disjoint.yml'
      - 'docs/POINT_RANDOM_SELECTION_DISJOINT.md'
      - 'run-trigger/point-random-selection-disjoint/**'

permissions:
  contents: read
  actions: read

jobs:
  point-random-selection-disjoint:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/point_random_selection_residual_validate.py src/point_random_selection_residual_disjoint.py
      - name: Materialize immutable expanded48 source artifact
        uses: actions/download-artifact@v4
        with:
          name: real-dr11-expanded48-32848895159
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32848895159
      - name: Run disjoint 2%-4% point-random replication
        run: |
          python src/point_random_selection_residual_disjoint.py \
            --fraction 0.02 \
            --out results/real_dr11/point_random_selection_residual36_disjoint
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-point-random-selection-disjoint-${{ github.run_id }}
          path: results/real_dr11/point_random_selection_residual36_disjoint
          if-no-files-found: error
          retention-days: 90
