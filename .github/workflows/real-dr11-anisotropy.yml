name: REAL DR11 anisotropy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/anisotropy_validate.py'
      - '.github/workflows/real-dr11-anisotropy.yml'

permissions:
  contents: read

jobs:
  anisotropy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 48-field sky-axis anisotropy test
        run: |
          rm -rf results/real_dr11/anisotropy48
          python src/anisotropy_validate.py --out results/real_dr11/anisotropy48
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-anisotropy-${{ github.run_id }}
          path: results/real_dr11/anisotropy48
          if-no-files-found: error
          retention-days: 90
