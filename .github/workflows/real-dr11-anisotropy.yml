name: REAL DR11 anisotropy

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/anisotropy_validate.py'
      - 'src/d4_reconstruction_validate.py'
      - 'src/fetch_dr11_expanded.py'
      - '.github/workflows/real-dr11-anisotropy.yml'

permissions:
  contents: read

jobs:
  anisotropy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Fetch the fixed 48 REAL_DR11 position fields
        run: |
          rm -rf data/real/dr11/expanded48
          python src/fetch_dr11_expanded.py --out data/real/dr11/expanded48
      - name: Run 48-field square-tangent-plane anisotropy test
        run: |
          rm -rf results/real_dr11/anisotropy48
          python src/anisotropy_validate.py --out results/real_dr11/anisotropy48
      - name: Run D4-symmetrized Gaussian reconstruction test
        run: |
          python src/d4_reconstruction_validate.py --out results/real_dr11/anisotropy48
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-anisotropy-${{ github.run_id }}
          path: |
            data/real/dr11/expanded48/provenance.json
            results/real_dr11/anisotropy48
          if-no-files-found: error
          retention-days: 90
