name: REAL DR11 point-random Gaussianized phase

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/dr11-point-random-phase-surrogate]
    paths:
      - 'src/point_random_gaussian_phase_validate.py'
      - '.github/workflows/real-dr11-point-random-gaussian-phase.yml'
      - 'docs/POINT_RANDOM_GAUSSIAN_PHASE.md'
      - 'run-trigger/point-random-gaussian-phase/**'

permissions:
  contents: read
  actions: read

jobs:
  point-random-gaussian-phase:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/point_random_selection_residual_validate.py src/point_random_phase_surrogate_validate.py src/point_random_gaussian_phase_validate.py
      - name: Materialize immutable expanded48 source artifact
        uses: actions/download-artifact@v4
        with:
          name: real-dr11-expanded48-32848895159
          path: .
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 32848895159
      - name: Run Gaussianized residual exact-power test
        run: |
          python src/point_random_gaussian_phase_validate.py \
            --fraction 0.04 \
            --surrogates 32 \
            --out results/real_dr11/point_random_gaussian_phase36
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-point-random-gaussian-phase-${{ github.run_id }}
          path: results/real_dr11/point_random_gaussian_phase36
          if-no-files-found: error
          retention-days: 90
