name: REAL DR11 covariance independent confirmation

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/covariance-capacity-audit]
    paths:
      - 'src/selection_residual_covariance_confirm20.py'
      - '.github/workflows/real-dr11-covariance-confirm20.yml'
      - 'docs/COVARIANCE_INDEPENDENT_CONFIRMATION.md'

permissions:
  contents: write

jobs:
  confirm20:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/selection_residual_covariance_confirm20.py
      - name: Run preregistered 20-field confirmation
        run: |
          rm -rf results/real_dr11/selection_residual_covariance_confirm20
          python src/selection_residual_covariance_confirm20.py \
            --expanded-provenance data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/selection_residual_covariance_confirm20
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-covariance-confirm20-${{ github.run_id }}
          path: results/real_dr11/selection_residual_covariance_confirm20
          if-no-files-found: error
          retention-days: 90
      - name: Commit compact confirmation outputs to experiment branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            results/real_dr11/selection_residual_covariance_confirm20/summary.json \
            results/real_dr11/selection_residual_covariance_confirm20/test_field_metrics.csv \
            results/real_dr11/selection_residual_covariance_confirm20/selection_model_metrics.csv
          if git diff --cached --quiet; then
            echo 'No compact confirmation-result changes.'
          else
            git commit -m 'Record independent covariance confirmation results'
            git push origin HEAD:${{ github.head_ref }}
          fi
