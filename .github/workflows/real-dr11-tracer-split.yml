name: REAL DR11 tracer split

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/tracer_split_validate.py'
      - 'src/tracer_split_validate_fixed.py'
      - 'src/tracer_split_validate_48.py'
      - '.github/workflows/real-dr11-tracer-split.yml'

jobs:
  tracer-split:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run 48-brick PSF vs extended locality test
        run: |
          rm -rf results/real_dr11/tracer_split48
          python src/tracer_split_validate_48.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/tracer_split48
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-tracer-split48-${{ github.run_id }}
          path: results/real_dr11/tracer_split48
          if-no-files-found: error
          retention-days: 90
