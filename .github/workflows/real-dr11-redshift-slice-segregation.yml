name: REAL DR11 x DESI DR1 redshift slice segregation

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/redshift_slice_segregation_validate.py'
      - '.github/workflows/real-dr11-redshift-slice-segregation.yml'
      - 'docs/REDSHIFT_SLICE_SEGREGATION.md'
      - 'run-trigger/redshift-slice-segregation/**'

permissions:
  contents: read

jobs:
  redshift-slice-segregation:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/redshift_slice_segregation_validate.py
      - name: Run independent redshift-slice segregation confirmation
        run: |
          python src/redshift_slice_segregation_validate.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/redshift_slice_segregation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: real-dr11-redshift-slice-segregation-${{ github.run_id }}
          path: results/real_dr11/redshift_slice_segregation
          if-no-files-found: warn
          retention-days: 90
