name: REAL DR11 selection-residual cross-tracer bispectrum

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/cross_tracer_selection_residual_bispectrum.py'
      - '.github/workflows/real-dr11-cross-tracer-selection-residual.yml'
      - 'run-trigger/cross-tracer-selection/**'

permissions:
  contents: read

jobs:
  cross-tracer-selection-residual:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run selection-residualized cross-tracer bispectrum
        run: |
          rm -rf results/real_dr11/cross_tracer_selection_residual36
          python src/cross_tracer_selection_residual_bispectrum.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/cross_tracer_selection_residual36 \
            --folds 6
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-cross-tracer-selection-residual-${{ github.run_id }}
          path: results/real_dr11/cross_tracer_selection_residual36
          if-no-files-found: error
          retention-days: 90
