name: REAL DR11 cross-bispectrum sampling scaling

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/cross_bispectrum_sampling_scaling.py'
      - '.github/workflows/real-dr11-cross-bispectrum-sampling-scaling.yml'
      - 'run-trigger/cross-bispectrum-scaling/**'

permissions:
  contents: read

jobs:
  sampling-scaling:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run sampling-density scaling experiment
        run: |
          rm -rf results/real_dr11/cross_bispectrum_sampling_scaling33
          python src/cross_bispectrum_sampling_scaling.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/cross_bispectrum_sampling_scaling33
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-cross-bispectrum-sampling-scaling-${{ github.run_id }}
          path: results/real_dr11/cross_bispectrum_sampling_scaling33
          if-no-files-found: error
          retention-days: 90
