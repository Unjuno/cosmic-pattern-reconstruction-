name: REAL DR11 fixed-count cross-tracer bispectrum

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/fixed_count_cross_bispectrum_validate.py'
      - 'src/run_fixed_count_cross_bispectrum_native.py'
      - '.github/workflows/real-dr11-fixed-count-cross-bispectrum.yml'
      - 'run-trigger/fixed-count-cross/**'

permissions:
  contents: read

jobs:
  fixed-count-cross:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run fixed-count PSF-vs-extended phase-coupling test
        run: |
          rm -rf results/real_dr11/fixed_count_cross_bispectrum36
          python src/run_fixed_count_cross_bispectrum_native.py \
            --centers data/real/dr11/expanded48/provenance.json \
            --out results/real_dr11/fixed_count_cross_bispectrum36
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-fixed-count-cross-${{ github.run_id }}
          path: results/real_dr11/fixed_count_cross_bispectrum36
          if-no-files-found: error
          retention-days: 90
