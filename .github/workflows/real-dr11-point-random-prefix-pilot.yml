name: REAL DR11 point-random prefix pilot

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/dr11-official-randoms]
    paths:
      - 'src/point_random_prefix_pilot.py'
      - '.github/workflows/real-dr11-point-random-prefix-pilot.yml'
      - 'docs/POINT_RANDOM_PREFIX_PILOT.md'
      - 'run-trigger/point-random-prefix/**'

permissions:
  contents: read

jobs:
  point-random-prefix:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install repository dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/point_random_prefix_pilot.py
      - name: Run bounded point-random prefix pilot
        run: |
          python src/point_random_prefix_pilot.py \
            --fraction 0.002 \
            --files 20 \
            --out results/real_dr11/point_random_prefix_pilot
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-point-random-prefix-${{ github.run_id }}
          path: results/real_dr11/point_random_prefix_pilot
          if-no-files-found: error
          retention-days: 90
