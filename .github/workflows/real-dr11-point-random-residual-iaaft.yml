name: REAL DR11 point-random residual IAAFT

on:
  workflow_dispatch:
  pull_request:
    branches: [experiment/dr11-point-random-gaussian-phase]
    paths:
      - 'src/point_random_residual_iaaft_validate.py'
      - '.github/workflows/real-dr11-point-random-residual-iaaft.yml'
      - 'docs/POINT_RANDOM_RESIDUAL_IAAFT.md'
      - 'run-trigger/point-random-residual-iaaft/**'

permissions:
  contents: read
  actions: read

jobs:
  point-random-residual-iaaft:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m py_compile src/point_random_residual_iaaft_validate.py
      - name: Materialize provenance-locked dense4 residual cache
        uses: actions/download-artifact@v4
        with:
          name: real-dr11-point-random-gaussian-phase-34144835351
          path: residual_cache
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34144835351
      - name: Run residual IAAFT locality test
        run: |
          python src/point_random_residual_iaaft_validate.py \
            --cache residual_cache/residual_maps.npz \
            --manifest residual_cache/residual_map_manifest.json \
            --surrogates 32 \
            --iterations 150 \
            --out results/real_dr11/point_random_residual_iaaft36
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-point-random-residual-iaaft-${{ github.run_id }}
          path: results/real_dr11/point_random_residual_iaaft36
          if-no-files-found: error
          retention-days: 90
