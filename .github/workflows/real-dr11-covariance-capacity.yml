name: REAL DR11 covariance capacity audit

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/selection_residual_covariance_capacity.py'
      - '.github/workflows/real-dr11-covariance-capacity.yml'
      - 'docs/COVARIANCE_CAPACITY_AUDIT.md'

permissions:
  contents: write

jobs:
  covariance-capacity:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          # Pull-request workflows otherwise check out a synthetic merge ref;
          # commits made there cannot fast-forward the PR head branch.
          ref: ${{ github.head_ref || github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run post-hoc covariance capacity audit
        run: |
          rm -rf results/real_dr11/selection_residual_covariance_capacity36
          python src/selection_residual_covariance_capacity.py \
            --out results/real_dr11/selection_residual_covariance_capacity36
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-covariance-capacity-${{ github.run_id }}
          path: results/real_dr11/selection_residual_covariance_capacity36
          if-no-files-found: error
          retention-days: 90
      - name: Commit compact audit outputs to experiment branch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            results/real_dr11/selection_residual_covariance_capacity36/summary.json \
            results/real_dr11/selection_residual_covariance_capacity36/test_field_metrics.csv \
            results/real_dr11/selection_residual_covariance_capacity36/validation_tuning.csv
          if git diff --cached --quiet; then
            echo 'No compact result changes.'
          else
            git commit -m 'Record covariance capacity audit results'
            git push origin HEAD:${{ github.head_ref }}
          fi
