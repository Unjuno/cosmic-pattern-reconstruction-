name: REAL DR11 selection-residual locality decay

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'src/selection_residual_locality_decay.py'
      - '.github/workflows/real-dr11-selection-residual-locality.yml'
      - 'run-trigger/selection-residual-locality/**'

permissions:
  contents: read

jobs:
  selection-residual-locality:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run selection-residual locality decay
        run: |
          rm -rf results/real_dr11/selection_residual_locality36
          python src/selection_residual_locality_decay.py \
            --out results/real_dr11/selection_residual_locality36 \
            --folds 6
      - uses: actions/upload-artifact@v4
        with:
          name: real-dr11-selection-residual-locality-${{ github.run_id }}
          path: results/real_dr11/selection_residual_locality36
          if-no-files-found: error
          retention-days: 90
